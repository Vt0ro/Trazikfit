async function doPush(){if(!me||!ready)return;if(pushing){again=true;return}pushing=true;try{
const m=metaStr();
if(m!==lastMeta){lastMeta=m;const t=Date.now();S.mts=t;await db.collection('users').doc(me.uid).set({meta:m,ts:t,ath:S.user,name:me.displayName||'',email:me.email||''},{merge:true});try{localStorage.setItem('plan_v1',JSON.stringify(S))}catch(e){}}
const cur={};S.sessions.forEach(s=>{const d=dest(s);if(d)cur[d+'/'+s.id]=JSON.stringify(s)});const ops=[];
Object.keys(cur).forEach(k=>{if(synced[k]!==cur[k])ops.push(['s',k])});Object.keys(synced).forEach(k=>{if(!(k in cur))ops.push(['d',k])});
for(let i=0;i<ops.length;i+=400){const b=db.batch(),part=ops.slice(i,i+400);part.forEach(([t,k])=>{const j=k.indexOf('/'),ref=sessRef(k.slice(0,j)).doc(k.slice(j+1));t==='s'?b.set(ref,{j:cur[k],ts:Date.now()}):b.delete(ref)});await b.commit();part.forEach(([t,k])=>{t==='s'?synced[k]=cur[k]:delete synced[k]})}
for(const ath of Object.keys(S.linked)){const u=S.linked[ath],p=S.plans[ath];if(!p||!p.length)continue;const j=JSON.stringify(p);if(lastC[u]!==j){await db.collection('users').doc(u).update({cplans:JSON.stringify({[ath]:p}),cts:Date.now()});lastC[u]=j}}
if(cmsg){cmsg='';renderCloud()}}catch(e){cmsg=errTxt(e);renderCloud()}pushing=false;if(again){again=false;cloudPush()}}
function login(){const p=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(p).catch(e=>{if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(p);else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){cmsg=errTxt(e);renderCloud()}})}
async function inviteStudent(raw){const to=String(raw).trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){cmsg='Escribe un correo válido.';return renderCloud()}if(to===(me.email||'').toLowerCase()){cmsg='Ese es tu propio correo.';return renderCloud()}
try{await db.collection('invites').doc(me.uid+'_'+to).set({to,coachUid:me.uid,coachName:me.displayName||me.email,ts:Date.now()});cmsg='✓ Invitación enviada a '+to+'. Tu alumno la verá al iniciar sesión con ese correo.'}catch(e){cmsg=errTxt(e)}renderCloud()}
async function acceptInvite(id){const iv=invIn.find(x=>x.id===id);if(!iv)return;
if(S.role!=='atleta'){const n=(me.displayName||'Alumno').split(' ')[0].replace(/[<>"&]/g,'');if(!confirm('Para ser alumno de '+iv.coachName+', la app pasará a modo Atleta con el nombre «'+n+'». ¿Continuar?'))return;if(!S.users.includes(n)){S.users.push(n);S.plans[n]=S.plans[n]||[]}S.user=n;S.role='atleta';S.pm=0;S.view='month';save();render()}
try{await db.collection('users').doc(me.uid).set({coaches:FV().arrayUnion(iv.coachUid),cn:{[iv.coachUid]:iv.coachName},ath:S.user},{merge:true});await db.collection('invites').doc(id).delete();cmsg='✓ Ahora '+iv.coachName+' es tu entrenador.'}catch(e){cmsg=errTxt(e)}renderCloud()}
async function delInvite(id){try{await db.collection('invites').doc(id).delete()}catch(e){cmsg=errTxt(e)}renderCloud()}
async function unlinkCoach(u){try{await db.collection('users').doc(me.uid).update({coaches:FV().arrayRemove(u)})}catch(e){cmsg=errTxt(e)}renderCloud()}
const BK=['sessions','users','plans','annex','prs','axs'];
function dlBackup(){const o={app:'trazikfit',v:2,d:Object.fromEntries(BK.map(k=>[k,S[k]]))},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='trazik-fit-copia-'+today+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function restoreBackup(f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=='trazikfit'||!o.d)throw 0;if(!confirm('Esto reemplaza los datos de este dispositivo por los de la copia. ¿Continuar?'))return;BK.forEach(k=>{if(o.d[k]!==undefined)S[k]=o.d[k]});fixS();save();render();renderCloud()}catch(e){alert('Ese archivo no es una copia válida de Trazik Fit.')}};r.readAsText(f)}
function renderCloud(){if(!aOpen)return;const old=document.getElementById('cl-code'),v=old?old.value:'',foc=old&&document.activeElement===old;let h='<b style="font-size:17px">☁️ Cuenta y nube</b>';
if(!window.firebase)h+='<div class="card"><p class="muted">No se pudo cargar Firebase (¿sin internet?). La app sigue funcionando y guardando en este dispositivo.</p></div>';
else if(!CFG_OK)h+='<div class="card"><p class="muted">Falta pegar tus claves de Firebase al inicio del archivo index.html (busca PEGA_AQUI). Sigue la guía paso a paso.</p></div>';
else if(!me)h+=`<div class="card"><p class="muted">Inicia sesión para guardar tus datos en la nube y compartirlos con tu entrenador o tus alumnos.</p><button class="pri" data-ca="login">Iniciar sesión con Google</button>${cmsg?`<div class="muted" style="margin-top:8px">${esc(cmsg)}</div>`:''}</div>`;
else{const cs=myDoc.coaches||[],al=Object.keys(S.linked),row=(l,b)=>`<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:6px"><span>${l}</span><span>${b}</span></div>`;
h+=`<div class="card"><span class="dot ${ready&&!cmsg?'ok':''}"></span>${ready?'Sincronizado':'Conectando…'}<div class="muted" style="margin:6px 0">${esc(me.displayName||'')} · ${esc(me.email||'')}</div><button class="ghost del" data-ca="logout">Cerrar sesión</button>${cmsg?`<div class="muted" style="margin-top:8px">${esc(cmsg)}</div>`:''}</div>
${invIn.length?`<div class="card"><b>Invitaciones recibidas</b>${invIn.map(i=>row(esc(i.coachName)+' quiere ser tu entrenador',`<button class="pri" data-ca="acc" data-u="${i.id}">Aceptar</button><button class="ghost del" data-ca="rej" data-u="${i.id}">Rechazar</button>`)).join('')}</div>`:''}
<div class="card"><b>Mis alumnos</b><p class="muted" style="margin:4px 0 8px">Escribe el correo de Google de tu alumno. Cuando inicie sesión y acepte, aparecerá en «Atletas».</p><div class="row" style="flex-wrap:nowrap"><input class="in" id="cl-code" type="email" placeholder="correo@gmail.com" autocomplete="off" value="${esc(v)}"><button class="pri" data-ca="inv">Invitar</button></div>${al.map(a=>row(esc(a),'')).join('')}${invOut.map(i=>row(esc(i.to)+' <small class="muted">(pendiente)</small>',`<button class="ghost del" data-ca="rej" data-u="${i.id}">Cancelar</button>`)).join('')}</div>
<div class="card"><b>Mi entrenador</b>${cs.length?cs.map(u=>row(esc((myDoc.cn||{})[u]||'Entrenador'),`<button class="ghost del" data-ca="unlink" data-u="${u}">Quitar</button>`)).join(''):'<p class="muted" style="margin:4px 0 0">Si tu entrenador te invita, la invitación aparecerá aquí al iniciar sesión.</p>'}</div>`}
h+='<div class="card"><b>Copia de seguridad</b><p class="muted" style="margin:4px 0 8px">Un archivo con todos tus datos de este dispositivo.</p><div class="row"><button data-ca="dl">Descargar copia</button><label class="chip" style="cursor:pointer">Restaurar copia<input type="file" accept=".json,application/json" id="cl-f" hidden></label></div></div><button data-ca="close" style="width:100%">Cerrar</button>';
CM.innerHTML='<div class="modal" data-cbg><div class="sheet">'+h+'</div></div>';if(foc){const i=document.getElementById('cl-code');if(i){i.focus();i.setSelectionRange(v.length,v.length)}}}
CM.onclick=e=>{const t=e.target;if(t.dataset.cbg!==undefined){aOpen=false;CM.innerHTML='';return}const a=t.dataset.ca;if(!a)return;
if(a==='close'){aOpen=false;CM.innerHTML='';return}
if(a==='login')login();else if(a==='logout'){if(confirm('¿Cerrar sesión? Tus datos seguirán guardados en este dispositivo y en la nube.'))auth.signOut()}
else if(a==='inv')inviteStudent(document.getElementById('cl-code').value);else if(a==='acc')acceptInvite(t.dataset.u);else if(a==='rej')delInvite(t.dataset.u);else if(a==='unlink')unlinkCoach(t.dataset.u);else if(a==='dl')dlBackup()};
CM.onchange=e=>{if(e.target.id==='cl-f'&&e.target.files[0])restoreBackup(e.target.files[0])};
document.addEventListener('click',e=>{if(e.target.closest('[data-live]')){aOpen=true;renderCloud()}});

render();initCloud();
</script></body></html>
